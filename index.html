<!DOCTYPE html>
<html>
<head>
  <title>Topper Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #ffffff;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 38px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .countdown {
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      font-size: 15px;
      color: #00ff99;
    }

    .search {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #222;
      margin-bottom: 20px;
      font-size: 15px;
      background: #141414;
      color: white;
    }

    .search::placeholder {
      color: #555;
    }

    .card {
      background: linear-gradient(145deg, #141414, #1a1a1a);
      padding: 26px;
      border-radius: 20px;
      margin-bottom: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid #1f1f1f;
      font-size: 18px;
      font-weight: 500;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,255,150,0.08);
    }

    .add-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: #ffffff;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 30px;
    }

    #viewer {
      display: none;
      height: 90vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }

    .back {
      margin-bottom: 15px;
      cursor: pointer;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>TOPPER VAULT</h1>
  <div class="subtitle">Your academic command center.</div>

  <div class="countdown" id="countdown"></div>

  <input type="text" class="search" placeholder="Search subjects..." oninput="filterSubjects(this.value)">

  <button class="add-btn" onclick="addSubject()">+ Add Subject</button>

  <div id="subjects"></div>

  <div id="viewer">
    <div class="back" onclick="goBack()">← Back</div>
    <iframe id="driveFrame"></iframe>
  </div>

</div>

<script>

/* ---------- PWA REGISTER ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}

/* ---------- EXAM COUNTDOWN ---------- */
const examDate = new Date("2026-08-01");

function updateCountdown() {
  const today = new Date();
  const diff = examDate - today;
  const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
  document.getElementById("countdown").innerText =
    days > 0 ? "NABARD Exam – " + days + " days left"
             : "Exam Day Has Arrived.";
}

updateCountdown();

/* ---------- SUBJECT STORAGE ---------- */
let subjects = JSON.parse(localStorage.getItem("subjects")) || {
  "Horticulture": "1jqDXfY6FR80ywabGL-72vi3C72F8KaAb",
  "Entomology": "1LdnshWQjMRRe4JwuasV2Iagj4s0N_orU"
};

function saveSubjects() {
  localStorage.setItem("subjects", JSON.stringify(subjects));
}

/* ---------- RENDER ---------- */
function renderSubjects(filter = "") {
  const container = document.getElementById("subjects");
  container.innerHTML = "";

  Object.keys(subjects).forEach(subject => {
    if (subject.toLowerCase().includes(filter.toLowerCase())) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerText = subject;
      card.onclick = () => openDrive(subjects[subject]);
      container.appendChild(card);
    }
  });
}

renderSubjects();

/* ---------- SEARCH ---------- */
function filterSubjects(value) {
  renderSubjects(value);
}

/* ---------- ADD SUBJECT ---------- */
function addSubject() {
  const name = prompt("Enter subject name:");
  const id = prompt("Enter Google Drive folder ID:");

  if (name && id) {
    subjects[name] = id;
    saveSubjects();
    renderSubjects();
  }
}

/* ---------- DRIVE VIEWER ---------- */
function openDrive(folderId) {
  document.getElementById("subjects").style.display = "none";
  document.querySelector(".search").style.display = "none";
  document.querySelector(".add-btn").style.display = "none";
  document.getElementById("viewer").style.display = "block";

  document.getElementById("driveFrame").src =
    "https://drive.google.com/embeddedfolderview?id=" + folderId + "#list";
}

function goBack() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("subjects").style.display = "block";
  document.querySelector(".search").style.display = "block";
  document.querySelector(".add-btn").style.display = "block";
}

</script>

</body>
</html>
