<!DOCTYPE html>
<html>
<head>
  <title>Topper Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f4f1eb, #ebe6dc);
      color: #1a1a1a;
    }

    .container {
      max-width: 820px;
      margin: auto;
      padding: 80px 20px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(15px);
      padding: 28px;
      border-radius: 22px;
      margin-bottom: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 1px solid rgba(255,255,255,0.6);
      font-size: 18px;
      font-weight: 600;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    #viewer {
      display: none;
      height: 85vh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      display: none;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #555;
    }

    .back {
      margin-bottom: 15px;
      cursor: pointer;
      color: #555;
      font-size: 14px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Topper Vault</h1>
  <div class="subtitle">Structured academic system.</div>

  <div id="subjects"></div>

  <div id="viewer">
    <div class="back" onclick="goBack()">← Back</div>
    <div class="loading" id="loading">Opening folder…</div>
    <iframe id="driveFrame"></iframe>
  </div>

</div>

<script>

/* ---------- STRUCTURE ---------- */

let subjects = {
  "Horticulture": {
    "Notes": "1bnHgaot9b-W-wk5czRGiatvXEDA40Rvj",
    "PYQ": "1lXuJwo8mlmi_9SF-F2b-xs5wDfaCDyrS"
  }
};

/* ---------- RENDER SUBJECTS ---------- */

function renderSubjects() {
  const container = document.getElementById("subjects");
  container.innerHTML = "";

  Object.keys(subjects).forEach(subject => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerText = subject;
    card.onclick = () => renderSubFiles(subject);
    container.appendChild(card);
  });
}

/* ---------- RENDER SUBFILES ---------- */

function renderSubFiles(subject) {
  const container = document.getElementById("subjects");
  container.innerHTML = "";

  const backCard = document.createElement("div");
  backCard.className = "card";
  backCard.innerText = "← Back to Subjects";
  backCard.onclick = renderSubjects;
  container.appendChild(backCard);

  const subFiles = subjects[subject];

  Object.keys(subFiles).forEach(name => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerText = name;
    card.onclick = () => openDrive(subFiles[name]);
    container.appendChild(card);
  });
}

/* ---------- OPEN DRIVE ---------- */

function openDrive(folderId) {
  const viewer = document.getElementById("viewer");
  const iframe = document.getElementById("driveFrame");
  const loading = document.getElementById("loading");

  document.getElementById("subjects").style.display = "none";
  viewer.style.display = "block";

  iframe.style.display = "none";
  loading.style.display = "block";

  iframe.src =
    "https://drive.google.com/embeddedfolderview?id=" + folderId + "#list";

  iframe.onload = function() {
    loading.style.display = "none";
    iframe.style.display = "block";
  };
}

/* ---------- BACK ---------- */

function goBack() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("subjects").style.display = "block";
}

renderSubjects();

</script>

</body>
</html>
