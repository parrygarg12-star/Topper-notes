<!DOCTYPE html>
<html>
<head>
  <title>Topper Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .subject {
      margin-bottom: 50px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .grid img {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .grid img:hover {
      transform: scale(1.03);
    }

    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .viewer img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

  </style>
</head>
<body>

<h1>📚 Topper Vault</h1>

<div id="content"></div>

<div class="viewer" id="viewer" onclick="closeViewer()">
  <img id="viewer-img">
</div>

<script>
  const subjects = {
    "Horticulture": "horticulture.html",
    "Soil Science": "soil-science.html",
    "Plant Breeding": "plant-breeding.html"
  };

  const container = document.getElementById("content");

  Object.keys(subjects).forEach(subject => {
    const section = document.createElement("div");
    section.className = "subject";

    const button = document.createElement("div");
    button.style.padding = "20px";
    button.style.background = "#fff";
    button.style.borderRadius = "12px";
    button.style.cursor = "pointer";
    button.style.marginBottom = "15px";
    button.style.boxShadow = "0 4px 10px rgba(0,0,0,0.05)";
    button.innerText = subject;

    button.onclick = () => {
      window.location.href = subjects[subject];
    };

    section.appendChild(button);
    container.appendChild(section);
  });
</script>
</body>
</html>
