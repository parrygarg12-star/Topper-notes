<!DOCTYPE html>
<html>
<head>
  <title>Topper Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f4f1eb, #ebe6dc, #e6e0d6);
      background-size: 300% 300%;
      animation: gradientFlow 12s ease infinite;
      color: #1a1a1a;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 820px;
      margin: auto;
      padding: 80px 20px;
      transition: 0.3s ease;
    }

    h1 {
      font-size: 44px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .countdown {
      text-align: center;
      font-weight: 600;
      margin-bottom: 40px;
      font-size: 16px;
      color: #1f7a5c;
    }

    .search {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      margin-bottom: 20px;
      font-size: 15px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .card {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 22px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.4);
      font-size: 18px;
      font-weight: 600;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .add-btn {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: #1f7a5c;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    .add-btn:hover {
      background: #166c50;
    }

    .reset-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid #d8d2c7;
      background: transparent;
      color: #a94442;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 35px;
      transition: 0.3s;
    }

    .reset-btn:hover {
      background: rgba(169,68,66,0.1);
    }

    #viewer {
      display: none;
      height: 85vh;
      animation: fadeIn 0.3s ease;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
    }

    .back {
      margin-bottom: 15px;
      cursor: pointer;
      color: #555;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Topper Vault</h1>
  <div class="subtitle">A focused academic command center.</div>

  <div class="countdown" id="countdown"></div>

  <input type="text" class="search" placeholder="Search subjects..." oninput="filterSubjects(this.value)">

  <button class="add-btn" onclick="addSubject()">+ Add Subject</button>
  <button class="reset-btn" onclick="resetVault()">Reset Vault</button>

  <div id="subjects"></div>

  <div id="viewer">
    <div class="back" onclick="goBack()">← Back</div>
    <iframe id="driveFrame"></iframe>
  </div>

</div>

<script>

const examDate = new Date("2026-06-01");

function updateCountdown() {
  const today = new Date();
  const diff = examDate - today;
  const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
  document.getElementById("countdown").innerText =
    days > 0 ? "Sem ends – " + days + " days left"
             : "Exam Day Has Arrived.";
}
updateCountdown();

let subjects = JSON.parse(localStorage.getItem("subjects")) || {
  "Horticulture": "1jqDXfY6FR80ywabGL-72vi3C72F8KaAb",
  "Entomology": "1LdnshWQjMRRe4JwuasV2Iagj4s0N_orU"
};

function saveSubjects() {
  localStorage.setItem("subjects", JSON.stringify(subjects));
}

function renderSubjects(filter = "") {
  const container = document.getElementById("subjects");
  container.innerHTML = "";

  Object.keys(subjects).forEach(subject => {
    if (subject.toLowerCase().includes(filter.toLowerCase())) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerText = subject;
      card.onclick = () => openDrive(subjects[subject]);
      container.appendChild(card);
    }
  });
}
renderSubjects();

function filterSubjects(value) {
  renderSubjects(value);
}

function addSubject() {
  const name = prompt("Enter subject name:");
  const id = prompt("Enter Google Drive folder ID:");
  if (name && id) {
    subjects[name] = id;
    saveSubjects();
    renderSubjects();
  }
}

function resetVault() {
  const confirmReset = confirm("This will remove all saved subjects and reset the vault. Continue?");
  if (confirmReset) {
    localStorage.clear();
    location.reload(true);
  }
}

function openDrive(folderId) {
  document.getElementById("subjects").style.display = "none";
  document.querySelector(".search").style.display = "none";
  document.querySelector(".add-btn").style.display = "none";
  document.querySelector(".reset-btn").style.display = "none";
  document.getElementById("viewer").style.display = "block";
  document.getElementById("driveFrame").src =
    "https://drive.google.com/embeddedfolderview?id=" + folderId + "#list";
}

function goBack() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("subjects").style.display = "block";
  document.querySelector(".search").style.display = "block";
  document.querySelector(".add-btn").style.display = "block";
  document.querySelector(".reset-btn").style.display = "block";
}

</script>

</body>
</html>
