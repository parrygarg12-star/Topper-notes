<!DOCTYPE html>
<html>
<head>
  <title>Topper Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(to bottom, #f4f1eb, #ebe6dc);
  color: #1a1a1a;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 80px 20px;
  animation: fadeIn 0.6s ease;
}

h1 {
  font-size: 40px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 12px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 60px;
  font-size: 16px;
  letter-spacing: 0.3px;
}

.card {
  background: #ffffff;
  padding: 28px;
  border-radius: 20px;
  margin-bottom: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid #e6e2db;
  font-size: 18px;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}

#viewer {
  display: none;
  height: 90vh;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 16px;
}

.back {
  margin-bottom: 15px;
  cursor: pointer;
  color: #666;
  font-size: 14px;
  transition: 0.2s;
}

.back:hover {
  color: black;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
  </style>
</head>

<body>

<div class="container">

  <h1>Topper Vault</h1>
  <div class="subtitle">
    A distraction-free academic dashboard.
  </div>

  <div id="subjects"></div>

  <div id="viewer">
    <div class="back" onclick="goBack()">← Back</div>
    <iframe id="driveFrame"></iframe>
  </div>

</div>

<script>
const subjects = {
  "Horticulture": "1jqDXfY6FR80ywabGL-72vi3C72F8KaAb",
  "Entomology": "1LdnshWQjMRRe4JwuasV2Iagj4s0N_orU"
};

const container = document.getElementById("subjects");

Object.keys(subjects).forEach(subject => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerText = subject;
  card.onclick = () => openDrive(subjects[subject]);
  container.appendChild(card);
});

function openDrive(folderId) {
  document.getElementById("subjects").style.display = "none";
  document.getElementById("viewer").style.display = "block";

  document.getElementById("driveFrame").src =
    "https://drive.google.com/embeddedfolderview?id=" + folderId + "#list";
}

function goBack() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("subjects").style.display = "block";
}
</script>

</body>
</html>
